name: Publish ParaZeni Login

on:
  push:
    tags:
      - 'v*.*.*-parazeni.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace tools and Login dependencies
        run: pnpm install --frozen-lockfile --filter . --filter '@zitadel/login...'
      - name: Build standalone Login and run its unit tests
        run: |
          pnpm nx run @zitadel/login:build
          pnpm --filter @zitadel/login exec vitest run
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versioned Login image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/weichen-lin/parazeni-login:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
