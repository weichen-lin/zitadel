name: Publish ParaZeni Login

on:
  push:
    tags:
      - 'v*.*.*-parazeni.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit from parazeni-login
        run: |
          branch=refs/remotes/origin/parazeni-login
          if ! git show-ref --verify --quiet "$branch"; then
            echo "::error::Remote branch parazeni-login is missing."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "$branch"; then
            echo "::error::The release tag must point to a commit in parazeni-login."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace tools and Login dependencies
        run: pnpm install --frozen-lockfile --filter . --filter '@zitadel/login...'
      - name: Build standalone Login and run its unit tests
        run: |
          pnpm nx run @zitadel/login:build
          pnpm --filter @zitadel/login exec vitest run
      - name: Verify the standalone server serves the brand assets
        working-directory: apps/login/.next/standalone
        env:
          HOSTNAME: 127.0.0.1
          ZITADEL_API_URL: http://127.0.0.1:8999
          ZITADEL_SERVICE_USER_TOKEN: offline-brand-test
          OTEL_SDK_DISABLED: 'true'
        run: |
          node apps/login/server.js &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:3000/ui/v2/login
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 "$base/healthy" >/dev/null
          for asset in parazeni-logo.svg parazeni-logo-white.svg parazeni-impression.svg favicon.svg; do
            curl -fsS "$base/brand/$asset" | cmp - "apps/login/public/brand/$asset"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versioned Login image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/weichen-lin/parazeni-login:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
